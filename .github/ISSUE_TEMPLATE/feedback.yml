name: Feedback
description: Daily-driver feedback, friction or an idea (not a bug).
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Alpha exit criteria: daily use for 2 weeks, status right at least 95% of the time, no session lost on restart. Log what got in the way. Do not paste tokens, `.env` values or session transcripts.
  - type: input
    id: version
    attributes:
      label: Lotse version
      description: Git commit of the build (`git rev-parse --short HEAD`) or the version in Lotse.app.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.1 (Apple Silicon)"
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent involved
      options:
        - Claude Code
        - Codex
        - OpenCode
        - Shell
        - None / general
    validations:
      required: true
  - type: input
    id: agent_version
    attributes:
      label: Agent version
      description: Output of `claude --version`, `codex --version` or `opencode --version`.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Status accuracy
        - Sidebar and cards
        - Terminal
        - Sheets, Settings, palette
        - Notifications and Dock badge
        - Git and worktrees
        - Install and uninstall
        - Performance
        - Other
    validations:
      required: true
  - type: textarea
    id: situation
    attributes:
      label: What were you doing?
      description: The steps or the situation, in a few lines.
    validations:
      required: true
  - type: textarea
    id: wish
    attributes:
      label: What did you expect, or what would help?
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: How much did it get in the way?
      options:
        - Noticed it
        - Slowed me down
        - Made me leave Lotse for another terminal
